    <path d="M48 60 L48 28" />
    <path d="M48 60 L33 31.75" />
    <path d="M48 60 L63 31.75" />
    <path d="M48 60 L21.8 41.65" />
    <path d="M48 60 L74.2 41.65" />
    <path d="M20.5 42.6 A32.5 32.5 0 0 1 75.5 42.6" />
  </g>
  <!-- Ground band + trunk below -->
